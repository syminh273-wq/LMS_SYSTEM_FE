<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220" aria-label="LMS System" role="img">
  <defs>
    <!-- Dark blue to teal gradient -->
    <linearGradient id="blueTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a6c"/>
      <stop offset="50%" style="stop-color:#1a6b8a"/>
      <stop offset="100%" style="stop-color:#2ab7ca"/>
    </linearGradient>
    <!-- Gold to orange gradient -->
    <linearGradient id="goldOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c27f"/>
      <stop offset="50%" style="stop-color:#e8a849"/>
      <stop offset="100%" style="stop-color:#d4762c"/>
    </linearGradient>
    <!-- Teal gradient for book -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6b8a"/>
      <stop offset="100%" style="stop-color:#2ab7ca"/>
    </linearGradient>
    <!-- Dark blue gradient for cap -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a6c"/>
      <stop offset="100%" style="stop-color:#2a4a8c"/>
    </linearGradient>
  </defs>

  <!-- === GRADUATION CAP === -->
  <!-- Cap top (diamond shape) -->
  <polygon points="100,18 60,38 100,52 140,38" fill="url(#capGrad)"/>
  <!-- Cap side (left face) -->
  <polygon points="60,38 60,48 100,62 100,52" fill="#1a2a6c" opacity="0.85"/>
  <!-- Cap side (right face) -->
  <polygon points="140,38 140,48 100,62 100,52" fill="#2a4a8c" opacity="0.7"/>
  <!-- Star on cap -->
  <polygon points="100,28 102,33 107,33 103,36 104,41 100,38 96,41 97,36 93,33 98,33" fill="white" opacity="0.9"/>

  <!-- Tassel cord -->
  <line x1="140" y1="38" x2="148" y2="50" stroke="url(#goldOrange)" stroke-width="2" stroke-linecap="round"/>
  <!-- Tassel ball -->
  <circle cx="148" cy="52" r="3" fill="url(#goldOrange)"/>
  <!-- Tassel strand -->
  <line x1="148" y1="52" x2="148" y2="60" stroke="url(#goldOrange)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tassel end ball -->
  <circle cx="148" cy="62" r="2.5" fill="url(#goldOrange)"/>

  <!-- === OPEN BOOK === -->
  <!-- Left page -->
  <path d="M 100,65 L 55,75 L 55,115 L 100,105 Z" fill="url(#tealGrad)" opacity="0.9"/>
  <!-- Right page -->
  <path d="M 100,65 L 145,75 L 145,115 L 100,105 Z" fill="url(#tealGrad)" opacity="0.75"/>
  <!-- Spine -->
  <line x1="100" y1="65" x2="100" y2="105" stroke="#1a2a6c" stroke-width="2" opacity="0.5"/>
  <!-- Page lines left -->
  <line x1="62" y1="82" x2="95" y2="76" stroke="white" stroke-width="1.2" opacity="0.3"/>
  <line x1="62" y1="90" x2="95" y2="84" stroke="white" stroke-width="1.2" opacity="0.3"/>
  <line x1="62" y1="98" x2="95" y2="92" stroke="white" stroke-width="1.2" opacity="0.3"/>
  <!-- Page lines right -->
  <line x1="105" y1="76" x2="138" y2="82" stroke="white" stroke-width="1.2" opacity="0.3"/>
  <line x1="105" y1="84" x2="138" y2="90" stroke="white" stroke-width="1.2" opacity="0.3"/>
  <line x1="105" y1="92" x2="138" y2="98" stroke="white" stroke-width="1.2" opacity="0.3"/>

  <!-- === RISING ARROW / CHART LINE === -->
  <!-- Arrow path going up through the book -->
  <path d="M 52,108 Q 70,100 85,90 Q 95,82 100,78 Q 110,70 130,55" fill="none" stroke="url(#goldOrange)" stroke-width="5" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polygon points="130,55 120,52 126,46" fill="url(#goldOrange)"/>
  <!-- Data point dots on the line -->
  <circle cx="72" cy="96" r="3" fill="white" stroke="url(#goldOrange)" stroke-width="1.5"/>
  <circle cx="95" cy="82" r="3" fill="white" stroke="url(#goldOrange)" stroke-width="1.5"/>

  <!-- === TEXT === -->
  <!-- LMS -->
  <text x="100" y="155" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="900" fill="#1a2a6c" letter-spacing="-1">LMS</text>
  <!-- SYSTEM -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial,'Helvetica Neue',sans-serif" font-size="22" font-weight="700" fill="#1a6b8a" letter-spacing="3">SYSTEM</text>
  <!-- EMPOWERING LEARNING -->
  <text x="100" y="200" text-anchor="middle" font-family="Arial,'Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#888" letter-spacing="2">EMPOWERING LEARNING</text>
</svg>
