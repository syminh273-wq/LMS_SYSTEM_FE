<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 120" width="330" height="120" aria-label="LMS System" role="img">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#00b4d8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a3a7a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="lms" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#00b4d8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a3a7a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#ffe066;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d4a843;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="shine" cx="32%" cy="26%" r="58%">
      <stop offset="0%"   style="stop-color:#fff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </radialGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1a3a7a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Badge -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#shine)"/>
  <rect x="8" y="8" width="104" height="104" rx="26" fill="none" stroke="white" stroke-width="1.5" opacity="0.22"/>

  <!-- Open book: left page -->
  <path d="M 60,28 L 17,35 L 17,96 L 60,90 Z" fill="white" opacity="0.9"/>
  <!-- Right page -->
  <path d="M 60,28 L 103,35 L 103,96 L 60,90 Z" fill="white" opacity="0.9"/>
  <!-- Bottom depth shadow -->
  <path d="M 17,90 L 60,84 L 103,90 L 103,96 L 60,90 L 17,96 Z" fill="white" opacity="0.12"/>
  <!-- Top arch -->
  <path d="M 17,35 Q 60,26 103,35" fill="none" stroke="white" stroke-width="2" opacity="0.45"/>
  <!-- Spine -->
  <line x1="60" y1="27" x2="60" y2="90" stroke="white" stroke-width="2.2" opacity="0.6"/>

  <!-- Ruled lines left -->
  <line x1="22" y1="49" x2="55" y2="47" stroke="white" stroke-width="1.5" opacity="0.32"/>
  <line x1="22" y1="60" x2="55" y2="58" stroke="white" stroke-width="1.5" opacity="0.32"/>
  <line x1="22" y1="71" x2="55" y2="69" stroke="white" stroke-width="1.5" opacity="0.32"/>
  <line x1="22" y1="81" x2="55" y2="79" stroke="white" stroke-width="1.5" opacity="0.32"/>
  <!-- Ruled lines right -->
  <line x1="65" y1="47" x2="98" y2="49" stroke="white" stroke-width="1.5" opacity="0.32"/>
  <line x1="65" y1="58" x2="98" y2="60" stroke="white" stroke-width="1.5" opacity="0.32"/>
  <line x1="65" y1="69" x2="98" y2="71" stroke="white" stroke-width="1.5" opacity="0.32"/>
  <line x1="65" y1="79" x2="98" y2="81" stroke="white" stroke-width="1.5" opacity="0.32"/>

  <!-- Gold spark -->
  <circle cx="60" cy="24" r="5.5" fill="url(#gold)" opacity="0.95"/>
  <line x1="60" y1="13" x2="60" y2="17" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="51" y1="16" x2="54" y2="19" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="69" y1="16" x2="66" y2="19" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="47" y1="24" x2="51" y2="24" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="73" y1="24" x2="69" y2="24" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>

  <!-- Divider -->
  <rect x="128" y="18" width="2" height="84" rx="1" fill="#00b4d8" opacity="0.3"/>

  <!-- LMS text -->
  <text x="148" y="87"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="74" font-weight="900"
        fill="url(#lms)" letter-spacing="-2">LMS</text>

  <!-- SYSTEM text -->
  <text x="151" y="110"
        font-family="Arial,'Helvetica Neue',Arial,sans-serif"
        font-size="21" font-weight="500"
        fill="#00b4d8" letter-spacing="8" opacity="0.88">SYSTEM</text>
</svg>
